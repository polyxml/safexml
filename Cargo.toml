[package]
name = "safexml"
version = "1.2.0"
edition = "2021"
authors = ["Bailey Nguyen <bailey.tan.nguyen@gmail.com>"]
license = "MIT"
description = "High-performance, secure, modern XML parser and defused replacement built in Rust"
repository = "https://github.com/polyxml/safexml"
readme = "README.md"
keywords = ["xml", "security", "defusedxml", "xxe", "parser"]

[lib]
name = "_safexml"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30", features = ["abi3-py312"], optional = true }
quick-xml = { version = "0.42", features = ["encoding"] }
encoding_rs = "0.8"

[features]
default = []
# PyO3 bindings. Disable default features to get the pure-Rust parser only
# (used by the fuzz targets, which must not link libpython).
python = ["dep:pyo3"]
extension-module = ["python", "pyo3/extension-module"]

[dev-dependencies]
pyo3 = { version = "0.30", features = ["auto-initialize"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

