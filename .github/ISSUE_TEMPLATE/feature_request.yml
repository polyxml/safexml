name: Feature Request
description: Propose a new feature, security defense, or optimization for SafeXML
title: "[FEAT]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an enhancement to SafeXML!

  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: What problem would this feature or defense solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should this feature work? Include any proposed Python/Rust API signatures.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've evaluated.
