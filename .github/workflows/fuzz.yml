name: Nightly Fuzzing & Sanitizers

on:
  schedule:
    # Run every night at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: 'Duration to fuzz per target in seconds'
        required: false
        default: '600'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fuzz:
    name: Nightly ASan / UBSan libFuzzer Campaign (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [fuzz_parser, fuzz_structured_xml, fuzz_metamorphic, fuzz_doctype_scanner]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@cargo-fuzz

      - name: Seed initial corpus
        run: |
          mkdir -p fuzz/corpus/${{ matrix.target }}
          cp fuzz/seeds/*.xml fuzz/corpus/${{ matrix.target }}/ || true

      - name: Run libFuzzer with AddressSanitizer and value profiling
        run: |
          DURATION="${{ github.event.inputs.duration_seconds || '600' }}"
          echo "Starting fuzzing campaign for target ${{ matrix.target }} (${DURATION}s)..."
          cargo +nightly fuzz run ${{ matrix.target }} -- \
            -dict=fuzz/xml.dict \
            -use_value_profile=1 \
            -max_total_time="${DURATION}" \
            -print_final_stats=1

      - name: Archive crash artifacts if found
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crash-artifacts-${{ matrix.target }}
          path: |
            fuzz/artifacts/
            crash-*
            leak-*
            timeout-*
