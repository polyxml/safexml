name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-check:
    name: Rust Checks (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies and build safexml
        run: uv pip install --system -e ".[dev]"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: |
          cargo clippy --all-targets --no-default-features -- -D warnings
          cargo clippy --all-targets --features python -- -D warnings

      - name: Run Rust tests with 100% function and line coverage enforcement
        run: |
          cargo test --no-default-features
          rm -rf target/cov
          LLVM_PROFILE_FILE="target/cov/safexml-%p-%m.profraw" RUSTFLAGS="-C instrument-coverage" cargo test --features python --target-dir target/cov
          LLVM_BIN=$(rustc --print target-libdir)/../bin
          "$LLVM_BIN/llvm-profdata" merge -sparse target/cov/safexml-*.profraw -o target/cov/safexml.profdata
          BIN=$(find target/cov/debug/deps -maxdepth 1 -name '_safexml-*' -executable | head -n 1)
          REPORT=$("$LLVM_BIN/llvm-cov" report --instr-profile=target/cov/safexml.profdata "$BIN" --ignore-filename-regex='/.cargo/|/rustc/')
          echo "$REPORT"
          echo "$REPORT" | awk '/^TOTAL/ { if ($6 != 0 || $9 != 0) { print "Rust coverage below 100%!"; exit 1 } }'

      - name: Verify fuzz target compilation
        run: cargo check --manifest-path fuzz/Cargo.toml

  fuzz-smoke:
    name: libFuzzer ASan Smoke Test
    needs: rust-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Seed initial corpus
        run: |
          mkdir -p fuzz/corpus/fuzz_parser
          cp fuzz/seeds/*.xml fuzz/corpus/fuzz_parser/ || true

      - name: Run 15s libFuzzer smoke test with AddressSanitizer and XML dictionary
        run: |
          cargo +nightly fuzz run fuzz_parser -- \
            -dict=fuzz/xml.dict \
            -max_total_time=15 \
            -print_final_stats=1

  python-test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    needs: rust-check
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.python-version == '3.15' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies and build safexml
        run: uv pip install --system -e ".[dev]"

      - name: Lint Python with Ruff
        run: |
          ruff check python tests benchmarks scripts
          ruff format --check python tests benchmarks scripts

      - name: Typecheck Python with mypy
        run: mypy --strict python/safexml

      - name: Run pytest with 100% statement and branch coverage enforcement
        run: pytest -v --cov=safexml --cov-branch --cov-fail-under=100

      - name: Run W3C XML Conformance Test Suite (XMLTS 20130923)
        if: runner.os == 'Linux'
        run: python scripts/run_w3c_conformance.py

      - name: Run differential fuzzing smoke test
        run: python scripts/run_differential_fuzz.py --iterations 1000 --seed 42

  version-parity:
    name: Version Parity Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify Cargo.toml and pyproject.toml versions match
        run: python scripts/sync_version.py --check

