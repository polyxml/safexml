[package]
name = "safexml-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1.4", features = ["derive"] }
encoding_rs = "0.8"

[dependencies.safexml]
path = ".."
default-features = false

[[bin]]
name = "fuzz_parser"
path = "fuzz_targets/fuzz_parser.rs"
test = false
doc = false

[[bin]]
name = "fuzz_structured_xml"
path = "fuzz_targets/fuzz_structured_xml.rs"
test = false
doc = false

[[bin]]
name = "fuzz_metamorphic"
path = "fuzz_targets/fuzz_metamorphic.rs"
test = false
doc = false

[[bin]]
name = "fuzz_doctype_scanner"
path = "fuzz_targets/fuzz_doctype_scanner.rs"
test = false
doc = false
